<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="t d">
  <title id="t">回弯双角与三角护目镜</title>
  <desc id="d">白色圆角底板上的紫色剪影徽记：两侧回弯的角，下方为横向三角护目镜，镜片镂空。</desc>

  <defs>
    <!-- 角色代表色：紫色渐变，属于图形本身 -->
    <linearGradient id="purple" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#A98BF0"/>
      <stop offset="1" stop-color="#5A36B4"/>
    </linearGradient>

    <!-- macOS 标准的轻微投影（不需要可整段删除，连同下面 filter="..." 一起） -->
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.22"/>
      <feComposite in2="b" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="horn" d="
      M 185 282
      C 112 280, 67 233, 67 174
      C 67 116, 112 80, 158 88
      C 195 94, 215 125, 202 161
      C 196 136, 176 123, 152 130
      C 125 139, 124 176, 142 201
      C 159 225, 184 238, 216 241
      Z"/>

    <!-- 先合并轮廓，再挖镜片 -->
    <mask id="emblem" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"
          style="mask-type: luminance">
      <rect width="512" height="512" fill="black"/>
      <g fill="white">
        <use href="#horn"/>
        <use href="#horn" transform="translate(512 0) scale(-1 1)"/>
        <!-- 护目镜主体 -->
        <path d="
          M 158 257 Q 139 247, 139 270
          L 139 358 Q 139 381, 158 371
          L 239 328 Q 256 318, 273 328
          L 354 371 Q 373 381, 373 358
          L 373 270 Q 373 247, 354 257
          L 273 300 Q 256 310, 239 300 Z"/>
      </g>
      <!-- 三角镜片镂空 -->
      <g fill="black">
        <path d="M 165 281 L 223 314 L 165 347 Q 162 349, 162 343 L 162 285 Q 162 279, 165 281 Z"/>
        <path d="M 347 281 L 289 314 L 347 347 Q 350 349, 350 343 L 350 285 Q 350 279, 347 281 Z"/>
      </g>
    </mask>
  </defs>

  <!-- 底板：macOS 规范 824×824，边距 100，纯白。删掉这一行就是透明底 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185"
        fill="#FFFFFF" filter="url(#tile-shadow)"/>

  <!-- 徽记：放大 1.3 倍并居中到画布中心 -->
  <g transform="translate(512 512) scale(1.3) translate(-256 -234)">
    <rect width="512" height="512" fill="url(#purple)" mask="url(#emblem)"/>
    <!-- 瞳色点缀 -->
    <circle cx="256" cy="314" r="8" fill="#F36AC8"/>
  </g>
</svg>